[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abecmed-watch"
version = "1.1.0"
description = "Monitora o catalogo do bot da ABECMED e avisa no celular quando muda (ntfy)."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["abecmed", "typebot", "ntfy", "monitor"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[tool.setuptools]
py-modules = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff.lint]
select = ["F", "E9", "I"]