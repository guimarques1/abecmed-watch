name: check

on:
  schedule:
    # A cada 10 min, deslocado dos minutos redondos (:00, :10, ...) que sao os
    # mais disputados no agendador do GitHub e os que mais sofrem descarte.
    # O cron do Actions nao aceita intervalo sorteado, entao o
    # jitter abaixo espalha o horario. Para intervalo aleatorio de verdade,
    # use ./run.sh --loop numa maquina sua.
    - cron: "2,12,22,32,42,52 * * * *"
  workflow_dispatch:

concurrency:
  group: abecmed-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Espalha o horario dentro da janela de 10 min.
      - name: Jitter
        run: sleep $((RANDOM % 300))

      - name: Rodar
        env:
          ABECMED_CPF: ${{ secrets.ABECMED_CPF }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python3 bot.py

      # always(): quando o fluxo quebra o passo acima sai com 1, mas o estado
      # traz o flag "ja avisei que quebrou". Sem salvar, a quebra notificaria
      # de novo a cada 10 minutos.
      - name: Salvar estado
        if: always()
        run: |
          if [ -z "$(git status --porcelain estado.json)" ]; then
            echo "nada a salvar"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json
          git commit -m "estado: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Um push manual no meio do caminho nao pode derrubar a verificacao.
          for tentativa in 1 2 3; do
            git push && exit 0
            echo "push recusado (tentativa $tentativa), rebaseando"
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::warning::nao consegui salvar o estado; a proxima verificacao repete a notificacao"
